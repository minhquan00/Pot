name: lab-flood-test

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target URL (website của bạn)'
        required: true
        type: string
      preset:
        description: 'Preset chạy'
        required: true
        default: 'full20'
        type: choice
        options: [full20, custom]
      time:
        description: 'Thời gian (giây) — bỏ qua nếu preset=full20'
        required: false
        default: '60'
        type: string
      rate:
        description: 'Req/s/thread — bỏ qua nếu preset=full20'
        required: false
        default: '10'
        type: string
      threads:
        description: 'Số worker — bỏ qua nếu preset=full20'
        required: false
        default: '20'
        type: string
      cookie_count:
        description: 'Số phiên browser — bỏ qua nếu preset=full20'
        required: false
        default: '2'
        type: string

jobs:
  flood:
    runs-on: ubuntu-latest
    timeout-minutes: 120              # đủ cho time lên tới ~120 phút
    env:
      NODE_OPTIONS: '--max-old-space-size=2048'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Node.js and Script Syntax
        run: |
          echo "Node version: $(node -v)"
          node --check 1.js || { echo "Syntax error in 1.js"; exit 1; }

      - name: Resolve parameters
        id: p
        run: |
          if [ "${{ inputs.preset }}" = "full20" ]; then
            # Preset "full 20": 20 worker, 12 flooder/worker (240 socket) để không OOM
            echo "TIME=120"    >> $GITHUB_OUTPUT
            echo "RATE=10"     >> $GITHUB_OUTPUT
            echo "THREADS=20"  >> $GITHUB_OUTPUT
            echo "COOKIES=2"   >> $GITHUB_OUTPUT
            echo "STREAMS=12"  >> $GITHUB_OUTPUT
          else
            echo "TIME=${{ inputs.time }}"            >> $GITHUB_OUTPUT
            echo "RATE=${{ inputs.rate }}"            >> $GITHUB_OUTPUT
            echo "THREADS=${{ inputs.threads }}"      >> $GITHUB_OUTPUT
            echo "COOKIES=${{ inputs.cookie_count }}" >> $GITHUB_OUTPUT
            echo "STREAMS=150"                         >> $GITHUB_OUTPUT
          fi
          echo "---- Resolved ----"
          cat $GITHUB_OUTPUT

      - name: Install system deps (Chrome + Xvfb + Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 \
            libgbm1 libasound2t64 libxss1 libxtst6 libx11-xcb1 \
            libxcb-dri3-0 libdrm2 fonts-liberation ca-certificates
          npx puppeteer browsers install chrome --install-deps

      - name: Install npm deps
        run: |
          if [ -f package.json ]; then
            npm install
          else
            npm init -y >/dev/null
            npm i puppeteer-real-browser
          fi

      - name: Raise fd limit
        run: |
          sudo bash -c 'echo "fs.file-max=200000" >> /etc/sysctl.conf'
          echo "ulimit -n 65536" >> $GITHUB_ENV
          ulimit -n

      - name: Tune flooder count per worker
        run: |
          # Giảm MAX_CONCURRENT_STREAMS_PER_WORKER theo preset để tránh OOM
          sed -i "s/const MAX_CONCURRENT_STREAMS_PER_WORKER = [0-9]*;/const MAX_CONCURRENT_STREAMS_PER_WORKER = ${{ steps.p.outputs.STREAMS }};/" 1.js
          grep "MAX_CONCURRENT_STREAMS_PER_WORKER =" 1.js

      - name: System sanity (mem/cpu/limits)
        run: |
          echo "nproc: $(nproc)"
          free -h
          ulimit -n

      - name: Run flood (own asset)
        env:
          TARGET:  ${{ inputs.target }}
          TIME:    ${{ steps.p.outputs.TIME }}
          RATE:    ${{ steps.p.outputs.RATE }}
          THREADS: ${{ steps.p.outputs.THREADS }}
          COOKIES: ${{ steps.p.outputs.COOKIES }}
        run: |
          ulimit -n 65536
          echo "Running: target=$TARGET time=$TIME rate=$RATE threads=$THREADS cookies=$COOKIES"
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            node --max-old-space-size=2048 1.js \
              "$TARGET" "$TIME" "$RATE" "$THREADS" "$COOKIES" \
              2>&1 | tee run.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flood-log
          path: run.log
